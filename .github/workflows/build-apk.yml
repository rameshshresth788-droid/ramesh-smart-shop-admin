name: Build Debug APK

on:
  workflow_dispatch:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      # GitHub-hosted Android runners already contain the Android SDK.
      # Avoid android-actions/setup-android because its command-line-tools
      # download was the failing step in the previous run.
      - name: Set up Android SDK
        shell: bash
        run: |
          set -euo pipefail
          SDK_ROOT="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          echo "ANDROID_HOME=$SDK_ROOT" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$SDK_ROOT" >> "$GITHUB_ENV"

          SDKMANAGER="$SDK_ROOT/cmdline-tools/latest/bin/sdkmanager"
          if [ ! -x "$SDKMANAGER" ]; then
            SDKMANAGER="$(find "$SDK_ROOT/cmdline-tools" -type f -name sdkmanager -print -quit)"
          fi
          if [ -z "${SDKMANAGER:-}" ] || [ ! -x "$SDKMANAGER" ]; then
            echo "ERROR: sdkmanager not found under $SDK_ROOT/cmdline-tools" >&2
            exit 1
          fi

          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" "platform-tools" "platforms;android-36" "build-tools;36.0.0"

      # The ZIP was prepared without a binary wrapper JAR. Generate the official
      # wrapper on the runner using the exact Gradle version required by AGP 9.1.1.
      - name: Bootstrap Gradle 9.3.1 for wrapper generation
        shell: bash
        run: |
          set -euo pipefail
          curl -fsSL --retry 3 -o /tmp/gradle-bootstrap.zip \
            https://services.gradle.org/distributions/gradle-9.3.1-bin.zip
          rm -rf /tmp/gradle-bootstrap
          mkdir -p /tmp/gradle-bootstrap
          unzip -q /tmp/gradle-bootstrap.zip -d /tmp/gradle-bootstrap
          echo "/tmp/gradle-bootstrap/gradle-9.3.1/bin" >> "$GITHUB_PATH"

      - name: Regenerate Gradle wrapper JAR
        run: gradle wrapper --gradle-version 9.3.1 --distribution-type bin

      - name: Make gradlew executable
        run: chmod +x ./gradlew

      - name: Verify Gradle wrapper
        run: ./gradlew --version

      - name: Build debug APK
        run: ./gradlew assembleDebug --stacktrace --no-daemon

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: ramesh-smart-shop-admin-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
