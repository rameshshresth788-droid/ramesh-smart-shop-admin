name: Build Debug APK

# Manual "Run workflow" button, plus automatic runs on every push/PR to main.
on:
  workflow_dispatch:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]

# No secrets are used or required by this workflow. The app talks to its own
# backend at runtime (URL set from the Settings screen after install) - no
# Gemini key, Cloudinary secret, or DB password is ever baked into the APK,
# so none of those need to be added as GitHub secrets for this build to work.

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      # 1. Get the code
      - name: Checkout repository
        uses: actions/checkout@v4

      # 2. JDK 17 - required by AGP 9.x
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      # 3. Android SDK cmdline-tools, licenses accepted, platform-tools installed,
      #    sdkmanager added to PATH for the next step.
      - name: Set up Android SDK
        uses: android-actions/setup-android@v4

      # 4. Explicitly install the exact platform + build-tools this project
      #    compiles against (compileSdk 36 / targetSdk 36), and re-confirm licenses.
      - name: Accept licenses and install SDK Platform 36 + Build-Tools 36.0.0
        run: |
          yes | sdkmanager --licenses > /dev/null || true
          sdkmanager "platform-tools" "platforms;android-36" "build-tools;36.0.0"

      # 5. This repository's committed gradle-wrapper.jar is a placeholder only
      #    (it could not be produced as a real, working binary in the sandboxed
      #    environment this project was assembled in - see README "Known
      #    Limitations"). This step downloads the exact official Gradle 9.3.1
      #    distribution directly from Gradle's own server (plain curl+unzip,
      #    no third-party action involved) purely to run `gradle wrapper`,
      #    which regenerates a correct, matching gradlew, gradlew.bat, and
      #    gradle-wrapper.jar. Every step after this one uses ./gradlew
      #    exclusively, exactly like a normal contributor would - this step
      #    never runs the actual app build.
      - name: Bootstrap a real Gradle 9.3.1 (used only to regenerate the wrapper)
        run: |
          curl -fsSL -o /tmp/gradle-bootstrap.zip https://services.gradle.org/distributions/gradle-9.3.1-bin.zip
          unzip -q /tmp/gradle-bootstrap.zip -d /tmp/gradle-bootstrap
          echo "/tmp/gradle-bootstrap/gradle-9.3.1/bin" >> "$GITHUB_PATH"

      - name: Regenerate gradlew / gradle-wrapper.jar
        run: gradle wrapper --gradle-version 9.3.1 --distribution-type bin

      - name: Make gradlew executable
        run: chmod +x ./gradlew

      # 6. The real build, via the wrapper only, from here on.
      - name: Build debug APK
        run: ./gradlew assembleDebug --stacktrace --no-daemon

      # 7. Make the APK downloadable from the workflow run page.
      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: ramesh-smart-shop-admin-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
